services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fitness
      POSTGRES_DB: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 backend/.env 配置随机数据库密码}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fitness_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fitness_postgres:
